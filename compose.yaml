services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clinicflow
      POSTGRES_USER: clinicflow_admin
      POSTGRES_PASSWORD: clinicflow_admin_local
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicflow_admin -d clinicflow"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - clinicflow_postgres:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

volumes:
  clinicflow_postgres:
